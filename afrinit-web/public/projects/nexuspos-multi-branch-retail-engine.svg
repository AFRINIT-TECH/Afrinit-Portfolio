<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2122"/>
      <stop offset="100%" stop-color="#2b3336"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Glow effect -->
  <circle cx="530" cy="200" r="160" fill="#14b8a6" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Technical Graphic -->
  <rect x="450" y="130" width="160" height="110" rx="12" fill="none" stroke="#14b8a6" stroke-width="5"/><line x1="470" y1="160" x2="520" y2="160" stroke="#14b8a6" stroke-width="4"/><line x1="470" y1="180" x2="550" y2="180" stroke="#14b8a6" stroke-width="4"/><circle cx="570" cy="200" r="16" fill="#14b8a6"/>
  
  <!-- Info Overlay -->
  <g transform="translate(50, 340)">
    <rect x="-10" y="-26" width="280" height="28" rx="6" fill="rgba(0,0,0,0.4)"/>
    <text x="0" y="-8" font-family="monospace" font-size="13" font-weight="bold" fill="#14b8a6" letter-spacing="2">CLOUD COMMERCE & INVENTORY</text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">NexusPOS Retail Engine</text>
  </g>
</svg>