<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19241b"/>
      <stop offset="100%" stop-color="#283824"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Glow effect -->
  <circle cx="530" cy="200" r="160" fill="#52c41a" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Technical Graphic -->
  <path d="M480 250 C 480 150 560 120 620 110 C 600 180 570 230 480 250 Z" fill="#52c41a" opacity="0.7"/><path d="M580 250 C 580 170 510 140 450 130 C 470 190 500 230 580 250 Z" fill="#dcbf77" opacity="0.7"/>
  
  <!-- Info Overlay -->
  <g transform="translate(50, 340)">
    <rect x="-10" y="-26" width="280" height="28" rx="6" fill="rgba(0,0,0,0.4)"/>
    <text x="0" y="-8" font-family="monospace" font-size="13" font-weight="bold" fill="#52c41a" letter-spacing="2">AGRITECH & M-PESA DARAJA</text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">AgriBora Aggregator</text>
  </g>
</svg>