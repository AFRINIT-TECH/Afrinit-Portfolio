<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261928"/>
      <stop offset="100%" stop-color="#3b2240"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Glow effect -->
  <circle cx="530" cy="200" r="160" fill="#c084fc" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Technical Graphic -->
  <polygon points="530,110 650,170 530,230 410,170" fill="none" stroke="#c084fc" stroke-width="5"/><line x1="410" y1="190" x2="410" y2="240" stroke="#c084fc" stroke-width="5"/><line x1="650" y1="190" x2="650" y2="240" stroke="#c084fc" stroke-width="5"/><path d="M410 240 Q 530 290 650 240" fill="none" stroke="#c084fc" stroke-width="5"/>
  
  <!-- Info Overlay -->
  <g transform="translate(50, 340)">
    <rect x="-10" y="-26" width="280" height="28" rx="6" fill="rgba(0,0,0,0.4)"/>
    <text x="0" y="-8" font-family="monospace" font-size="13" font-weight="bold" fill="#c084fc" letter-spacing="2">EDTECH & WEBSOCKET EVALS</text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">SomaHub Technical LMS</text>
  </g>
</svg>