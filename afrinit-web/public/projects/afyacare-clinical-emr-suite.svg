<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142028"/>
      <stop offset="100%" stop-color="#1d3240"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Glow effect -->
  <circle cx="530" cy="200" r="160" fill="#38bdf8" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Technical Graphic -->
  <rect x="510" y="120" width="40" height="120" rx="10" fill="#38bdf8"/><rect x="470" y="160" width="120" height="40" rx="10" fill="#38bdf8"/><circle cx="530" cy="180" r="85" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="12 12"/>
  
  <!-- Info Overlay -->
  <g transform="translate(50, 340)">
    <rect x="-10" y="-26" width="280" height="28" rx="6" fill="rgba(0,0,0,0.4)"/>
    <text x="0" y="-8" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="2">OFFLINE-FIRST HEALTHCARE</text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">AfyaCare Clinical EMR</text>
  </g>
</svg>