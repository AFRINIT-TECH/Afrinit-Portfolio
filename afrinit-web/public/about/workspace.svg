<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="ab-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1814"/>
      <stop offset="50%" stop-color="#2e241c"/>
      <stop offset="100%" stop-color="#14100c"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#9c6849" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e1814" stop-opacity="0"/>
    </radialGradient>
    <pattern id="iso-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(220, 191, 119, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#ab-grad)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#iso-grid)"/>
  
  <!-- Desk & Monitored Workspace Graphic -->
  <g transform="translate(250, 150)">
    <!-- Center Screen -->
    <rect x="180" y="50" width="340" height="200" rx="16" fill="#110e0c" stroke="#dcbf77" stroke-width="3"/>
    <rect x="200" y="70" width="300" height="160" rx="8" fill="#1e1814"/>
    <path d="M220 95 L280 95 M220 115 L360 115 M220 135 L320 135 M220 165 L260 165 M220 185 L340 185" stroke="#dcbf77" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="450" cy="150" r="35" fill="none" stroke="#9c6849" stroke-width="4" stroke-dasharray="6 6"/>
    
    <!-- Left Screen -->
    <rect x="20" y="80" width="140" height="170" rx="12" fill="#14100d" stroke="#9c6849" stroke-width="2.5" opacity="0.9"/>
    <line x1="35" y1="105" x2="130" y2="105" stroke="#9c6849" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="125" x2="105" y2="125" stroke="#9c6849" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="145" x2="120" y2="145" stroke="#9c6849" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right Screen -->
    <rect x="540" y="80" width="140" height="170" rx="12" fill="#14100d" stroke="#9c6849" stroke-width="2.5" opacity="0.9"/>
    <circle cx="610" cy="140" r="25" fill="#dcbf77" opacity="0.2"/>
    <polyline points="565,185 595,155 620,170 650,135" fill="none" stroke="#dcbf77" stroke-width="3"/>
    
    <!-- Desk Surface -->
    <rect x="-50" y="260" width="800" height="18" rx="9" fill="#3d2d22"/>
    <rect x="300" y="250" width="100" height="10" rx="3" fill="#9c6849"/>
  </g>
  
  <!-- Studio Tag -->
  <g transform="translate(100, 560)">
    <rect x="0" y="0" width="360" height="44" rx="22" fill="rgba(0,0,0,0.5)" stroke="rgba(220, 191, 119, 0.3)" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="7" fill="#dcbf77"/>
    <text x="42" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1">NAIROBI &amp; KISUMU STUDIO ENVIRONMENT</text>
  </g>
</svg>